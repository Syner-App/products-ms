syntax = "proto3";

package products;

service ProductsService {
  rpc Create (CreateProductRequest) returns (Product);
  rpc FindAll (PaginationRequest) returns (ProductList);
  rpc FindOne (ProductById) returns (Product);
  rpc Update (UpdateProductRequest) returns (Product);
  rpc Remove (ProductById) returns (Product);
}

message ProductById {
  int32 id = 1;
}

message CreateProductRequest {
  string name = 1;
  double price = 2;
}

message UpdateProductRequest {
  int32 id = 1;
  optional string name = 2;
  optional double price = 3;
}

message PaginationRequest {
  optional int32 page = 1;
  optional int32 limit = 2;
}

message Product {
  int32 id = 1;
  string name = 2;
  double price = 3;
  bool available = 4;
}

message PaginationMeta {
  int32 total = 1;
  int32 page = 2;
  int32 lastPage = 3;
}

message ProductList {
  repeated Product data = 1;
  PaginationMeta meta = 2;
}
